name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      # Builds frontend/dist, which main.go's //go:embed all:frontend/dist
      # needs to exist for the desktop app to compile below.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The desktop app (package main) uses cgo bindings into GTK/WebKit on
      # Linux (see pkg/application's *_linux.go build tags) — installing
      # these lets `go build .`/`go vet ./...` actually compile it, catching
      # desktop build breaks here instead of only at release/package time.
      # internal/... and cmd/... need none of this; they're plain Go.
      - name: Install Linux GTK/WebKit dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: go vet
        run: go vet ./...

      # Scoped to the packages that actually build on a normal linux/amd64
      # host: build/ios and build/android are gated behind `ios`/`android`
      # GOOS-style build tags with no non-mobile counterpart, so a bare
      # `go build ./...` fails on build/ios ("function main is undeclared")
      # even though nothing is actually broken — those need their
      # respective mobile toolchains, not a wildcard build.
      - name: go build
        run: go build ./cmd/... ./internal/... .

      - name: go test
        run: go test ./... -race
